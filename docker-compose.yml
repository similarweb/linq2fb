# Optional: manual Firebolt Core for local debugging.
# Integration tests start Core via Testcontainers by default (FireboltCoreHost).
# To point tests at this compose instance instead, seed the DB yourself and set
# fireboltCore.externalUrl (e.g. in testsettings.local.json) to http://localhost:3473/
services:
  firebolt-core:
    image: ghcr.io/firebolt-db/firebolt-core:preview-rc
    container_name: firebolt-core
    pull_policy: always
    ports:
      - "3473:3473"
      - "8122:8122"
    healthcheck:
      test: ["CMD", "fbcli", "--command", "SELECT 42;"]
      interval: 5s
      timeout: 10s
      retries: 10
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        hard: 8589934592
        soft: 8589934592
