name: release

on:
    push:
        tags:
            - 'v*.*.*'   # MinVer-friendly tag pattern (v1.2.3)

jobs:
    pack-and-publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write   # to create GitHub Release
            packages: write   # for GitHub Packages if you use it later
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # required for MinVer to read tags

            - name: Setup .NET SDKs
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 9.0.x
                  cache: true
                  cache-dependency-path: |
                      **/Directory.Packages.props
                      **/global.json

            # Tag v6.0.0-rc.1 -> package/assembly version 6.0.0-rc.1.
            # Pin explicitly so Linux never falls back to MinVer height (0.0.0-alpha.*) if
            # Directory.Build.props / MinVerTagPrefix fails to load. Must be set at build time
            # because pack uses --no-build.
            - name: Resolve package version from tag
              id: ver
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            # Pack against the lowest supported linq2db (6.0.0) so the nupkg dependency is >= 6.0.0.
            # Materialized CTE uses the pre-6.3 name-suffix fallback in that build; CI covers native API on 6.3+.
            - name: Restore (linq2db 6.0.0)
              run: |
                  dotnet restore \
                    -p:Version=${{ steps.ver.outputs.version }} \
                    -p:LinqToDbVersion=6.0.0 \
                    -p:FireboltSdkVersion=1.9.1

            - name: Build (Release, all TFMs, linq2db 6.0.0)
              run: |
                  dotnet build -c Release -warnAsError \
                    -p:Version=${{ steps.ver.outputs.version }} \
                    -p:LinqToDbVersion=6.0.0 \
                    -p:FireboltSdkVersion=1.9.1 \
                    --no-restore

            - name: Test smoke (linq2db 6.0.0)
              run: |
                  dotnet test -c Release --no-build \
                    -p:LinqToDbVersion=6.0.0 \
                    -p:FireboltSdkVersion=1.9.1

            - name: Extract changelog for current tag
              id: changelog
              run: |
                  tag="${GITHUB_REF_NAME#v}"       # v5.0.0-rc.1 -> 5.0.0-rc.1
                  base="${tag%%-*}"                # 5.0.0-rc.1 -> 5.0.0

                  awk -v ver="$base" '
                    $0 ~ "^## \\["ver"\\]" {flag=1; next}
                    /^## \[/ && flag {flag=0}
                    flag {print}
                  ' CHANGELOG.md > RELEASE_NOTES.md

                  if [ ! -s RELEASE_NOTES.md ]; then
                    echo "ERROR: No changelog entry found for $base"
                    exit 1
                  fi

                  echo "release_notes<<EOF" >> $GITHUB_OUTPUT
                  cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Pack (symbols + notes)
              run: |
                  VERSION="${{ steps.ver.outputs.version }}"

                  # Don't pass release notes via -p: — MSBuild treats `; $ () {}` as syntax.
                  # Inject via a props file with CDATA instead.
                  mkdir -p artifacts
                  {
                    echo '<Project>'
                    echo '  <PropertyGroup>'
                    echo '    <PackageReleaseNotes><![CDATA['
                    cat RELEASE_NOTES.md
                    echo ']]></PackageReleaseNotes>'
                    echo '  </PropertyGroup>'
                    echo '</Project>'
                  } > artifacts/PackageReleaseNotes.props

                  dotnet pack src/Similarweb.LinqToDb.Firebolt/Similarweb.LinqToDB.Firebolt.csproj \
                    --no-build \
                    -c Release \
                    -o ./artifacts \
                    -p:Version="$VERSION" \
                    -p:PackageVersion="$VERSION" \
                    -p:LinqToDbVersion=6.0.0 \
                    -p:CustomBeforeDirectoryBuildProps="$PWD/artifacts/PackageReleaseNotes.props"

            - name: Push to NuGet
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
              run: >
                  dotnet nuget push "artifacts/*.nupkg"
                  -k "$NUGET_API_KEY"
                  -s https://api.nuget.org/v3/index.json
                  --skip-duplicate

            - name: Push symbols to NuGet
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
              run: >
                  dotnet nuget push "artifacts/*.snupkg"
                  -k "$NUGET_API_KEY"
                  -s https://api.nuget.org/v3/index.json
                  --skip-duplicate

            - name: Create GitHub Release (attach nupkg + snupkg)
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      artifacts/*.nupkg
                      artifacts/*.snupkg
                  body: ${{ steps.changelog.outputs.release_notes }}
                  prerelease: ${{ contains(github.ref_name, '-') }}
