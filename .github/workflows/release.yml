name: release

on:
    push:
        tags:
            - 'v*.*.*'   # MinVer-friendly tag pattern (v1.2.3)

jobs:
    pack-and-publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write   # to create GitHub Release
            packages: write   # for GitHub Packages if you use it later
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # required for MinVer to read tags

            - name: Setup .NET SDKs
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 9.0.x
                  cache: true

            - name: Restore
              run: dotnet restore

            - name: Build (Release, all TFMs)
              run: dotnet build -c Release -warnAsError

            - name: Test (last call)
              run: dotnet test -c Release --no-build

            - name: Extract changelog for current tag
              id: changelog
              run: |
                  tag="${GITHUB_REF_NAME#v}"       # v5.0.0-rc.1 -> 5.0.0-rc.1
                  base="${tag%%-*}"                # 5.0.0-rc.1 -> 5.0.0

                  awk -v ver="$base" '
                    $0 ~ "^## \\["ver"\\]" {flag=1; next}
                    /^## \[/ && flag {flag=0}
                    flag {print}
                  ' CHANGELOG.md > RELEASE_NOTES.md

                  if [ ! -s RELEASE_NOTES.md ]; then
                    echo "ERROR: No changelog entry found for $base"
                    exit 1
                  fi

                  echo "release_notes<<EOF" >> $GITHUB_OUTPUT
                  cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Pack (symbols + notes)
              run: |
                  notes=$(sed "s/'/''/g" RELEASE_NOTES.md | tr '\n' ' ')
                  dotnet pack src/Similarweb.LinqToDB.Firebolt/Similarweb.LinqToDB.Firebolt.csproj \
                  --no-build \
                  -c Release \
                  -o ./artifacts \
                  /p:PackageReleaseNotes="$notes"

            - name: Push to NuGet
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
              run: >
                  dotnet nuget push "artifacts/*.nupkg"
                  -k "$NUGET_API_KEY"
                  -s https://api.nuget.org/v3/index.json
                  --skip-duplicate

            - name: Push symbols to NuGet
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
              run: >
                  dotnet nuget push "artifacts/*.snupkg"
                  -k "$NUGET_API_KEY"
                  -s https://api.nuget.org/v3/index.json
                  --skip-duplicate

            - name: Create GitHub Release (attach nupkg + snupkg)
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      artifacts/*.nupkg
                      artifacts/*.snupkg
                  body: ${{ steps.changelog.outputs.release_notes }}
                  prerelease: ${{ contains(github.ref_name, '-') }}
