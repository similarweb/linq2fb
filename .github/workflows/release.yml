name: release

on:
    push:
        tags:
            # One tag → one nupkg. Package minor is the linq2db ABI line:
            #   v6.0.*  → compile 6.0.0, nuspec [6.0.0, 6.4.0)
            #   v6.4.*  → compile 6.4.0, nuspec >= 6.4.0
            - 'v6.0.*'
            - 'v6.4.*'

jobs:
    pack-and-publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write   # to create GitHub Release
            packages: write   # for GitHub Packages if you use it later
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # required for MinVer to read tags

            - name: Resolve pack line
              id: line
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  case "$GITHUB_REF_NAME" in
                    v6.0.*)
                      LINQ2DB=6.0.0
                      MIN=6.0.0
                      MAX=6.4.0
                      RANGE='[6.0.0, 6.4.0)'
                      ;;
                    v6.4.*)
                      LINQ2DB=6.4.0
                      MIN=6.4.0
                      MAX=
                      RANGE='6.4.0'
                      ;;
                    *)
                      echo "Unexpected tag $GITHUB_REF_NAME"
                      exit 1
                      ;;
                  esac
                  {
                    echo "version=$VERSION"
                    echo "linq2db=$LINQ2DB"
                    echo "min=$MIN"
                    echo "max=$MAX"
                    echo "range=$RANGE"
                  } >> "$GITHUB_OUTPUT"
                  echo "Pack $VERSION against linq2db $LINQ2DB (nuspec $RANGE)"

            - name: Setup .NET SDKs
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: |
                      8.0.x
                      9.0.x
                  cache: true
                  cache-dependency-path: |
                      **/Directory.Packages.props
                      **/global.json

            - name: Extract changelog
              id: changelog
              run: |
                  VER="${{ steps.line.outputs.version }}"
                  awk -v ver="$VER" '
                    $0 ~ "^## \\["ver"\\]" {flag=1; print; next}
                    /^## \[/ && flag {flag=0}
                    flag {print}
                  ' CHANGELOG.md > RELEASE_NOTES.md

                  if [ ! -s RELEASE_NOTES.md ] || ! grep -q '^- ' RELEASE_NOTES.md; then
                    echo "ERROR: Expected changelog section [$VER]"
                    cat RELEASE_NOTES.md || true
                    exit 1
                  fi

                  echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
                  cat RELEASE_NOTES.md >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"

            - name: Smoke test (linq2db ${{ steps.line.outputs.linq2db }})
              run: |
                  RANGE_ARGS=(-p:MinLinqVersion="${{ steps.line.outputs.min }}")
                  if [ -n "${{ steps.line.outputs.max }}" ]; then
                    RANGE_ARGS+=(-p:MaxAllowedLinqVersion="${{ steps.line.outputs.max }}")
                  fi
                  dotnet restore \
                    -p:LinqToDbVersion=${{ steps.line.outputs.linq2db }} \
                    -p:FireboltSdkVersion=1.9.1 \
                    "${RANGE_ARGS[@]}"
                  dotnet build -c Release --warnAsError --no-restore \
                    -p:LinqToDbVersion=${{ steps.line.outputs.linq2db }} \
                    -p:FireboltSdkVersion=1.9.1 \
                    "${RANGE_ARGS[@]}"
                  dotnet test -c Release --no-build \
                    -p:LinqToDbVersion=${{ steps.line.outputs.linq2db }} \
                    -p:FireboltSdkVersion=1.9.1 \
                    "${RANGE_ARGS[@]}"

            - name: Pack (symbols + notes)
              run: |
                  VERSION="${{ steps.line.outputs.version }}"
                  LINQ2DB="${{ steps.line.outputs.linq2db }}"
                  MIN="${{ steps.line.outputs.min }}"
                  MAX="${{ steps.line.outputs.max }}"
                  RANGE_ARGS=(-p:MinLinqVersion="$MIN")
                  if [ -n "$MAX" ]; then
                    RANGE_ARGS+=(-p:MaxAllowedLinqVersion="$MAX")
                  fi
                  mkdir -p artifacts
                  {
                    echo '<Project>'
                    echo '  <PropertyGroup>'
                    echo '    <PackageReleaseNotes><![CDATA['
                    cat RELEASE_NOTES.md
                    echo ']]></PackageReleaseNotes>'
                    echo '  </PropertyGroup>'
                    echo '</Project>'
                  } > artifacts/PackageReleaseNotes.props

                  # Tag is the nupkg version. MinVerSkip: two tags can share a SHA
                  # (v6.0.0-rc.2 and v6.4.0-rc.1); MinVer would pick the highest.
                  dotnet restore src/Similarweb.LinqToDb.Firebolt/Similarweb.LinqToDB.Firebolt.csproj \
                    -p:Version="$VERSION" \
                    -p:LinqToDbVersion="$LINQ2DB" \
                    -p:FireboltSdkVersion=1.9.1 \
                    "${RANGE_ARGS[@]}"
                  dotnet build src/Similarweb.LinqToDb.Firebolt/Similarweb.LinqToDB.Firebolt.csproj \
                    -c Release --warnAsError --no-restore \
                    -p:Version="$VERSION" \
                    -p:LinqToDbVersion="$LINQ2DB" \
                    -p:FireboltSdkVersion=1.9.1 \
                    "${RANGE_ARGS[@]}"
                  dotnet pack src/Similarweb.LinqToDb.Firebolt/Similarweb.LinqToDB.Firebolt.csproj \
                    --no-build \
                    -c Release \
                    -o ./artifacts \
                    -p:Version="$VERSION" \
                    -p:PackageVersion="$VERSION" \
                    -p:MinVerSkip=true \
                    -p:LinqToDbVersion="$LINQ2DB" \
                    -p:CustomBeforeDirectoryBuildProps="$PWD/artifacts/PackageReleaseNotes.props" \
                    "${RANGE_ARGS[@]}"

                  echo "Packed artifacts:"
                  ls -la artifacts/*.nupkg artifacts/*.snupkg
                  test -f "artifacts/Similarweb.LinqToDB.Firebolt.${VERSION}.nupkg"

            - name: Push to NuGet
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
              run: >
                  dotnet nuget push "artifacts/*.nupkg"
                  -k "$NUGET_API_KEY"
                  -s https://api.nuget.org/v3/index.json
                  --skip-duplicate

            - name: Push symbols to NuGet
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_KEY }}
              run: >
                  dotnet nuget push "artifacts/*.snupkg"
                  -k "$NUGET_API_KEY"
                  -s https://api.nuget.org/v3/index.json
                  --skip-duplicate

            - name: Create GitHub Release (attach nupkg + snupkg)
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      artifacts/*.nupkg
                      artifacts/*.snupkg
                  body: ${{ steps.changelog.outputs.release_notes }}
                  prerelease: ${{ contains(github.ref_name, '-') }}
