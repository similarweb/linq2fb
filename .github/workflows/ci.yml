name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
    build-test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                tfm: [net8.0, net9.0]
                fb: ["1.9.1"]
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - name: Select SDK version for this TFM
              id: pick-sdk
              run: |
                  case "${{ matrix.tfm }}" in
                    net8.0)
                      SDK_VER="8.0.414";;
                    net9.0)
                      SDK_VER="9.0.305";;
                    *)
                      echo "Unknown TFM ${{ matrix.tfm }}" >&2
                      exit 1;;
                  esac
                  {
                    echo "### SDK"
                    echo ""
                    echo "**.NET**: \`${{ matrix.tfm }}\`"
                    echo "**SDK version**: \`$SDK_VER\`"
                  }  >> $GITHUB_STEP_SUMMARY

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ steps.pick-sdk.outputs.sdk_version }}
                  cache: true
                  cache-dependency-path: |
                      **/packages.lock.json
                      **/Directory.Packages.props
                      **/global.json

            - name: Pin SDK for this lane
              run: |
                  cat > global.json <<JSON
                  {
                    "sdk": { "version": "${{ steps.pick-sdk.outputs.sdk_version }}", "rollForward": "disable", "allowPrerelease": false }
                  }
                  JSON
                  dotnet --info

            - name: Restore tools
              run: dotnet tool restore

            - name: Restore (${{ matrix.tfm }}, Firebolt ${{ matrix.fb }})
              run: |
                dotnet restore \
                  -p:TargetFramework=${{ matrix.tfm }} \
                  -p:FireboltSdkVersion=${{ matrix.fb }}

            - name: Build (${{ matrix.tfm }}, Firebolt ${{ matrix.fb }})
              run: |
                dotnet build \
                  -c Release \
                  -p:TargetFramework=${{ matrix.tfm }} \
                  -p:FireboltSdkVersion=${{ matrix.fb }} \
                  --warnAsError \
                  --no-restore

            - name: Test (${{ matrix.tfm }}, Firebolt ${{ matrix.fb }})
              run: |
                  # Firebolt Core is started by Testcontainers inside the test host
                  # (see FireboltCoreHost). Docker must be available on the runner.
                  dotnet test \
                    -c Release \
                    --collect:"XPlat Code Coverage" \
                    --results-directory ./coverage \
                    -f ${{ matrix.tfm }} \
                    -p:FireboltSdkVersion=${{ matrix.fb }} \
                    --no-build \
                    -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
            - name: Report coverage
              run: |
                dotnet reportgenerator \
                  -reports:coverage/*/coverage.cobertura.xml \
                  -targetdir:coverage/report \
                  -reporttypes:Html

                dotnet reportgenerator \
                  -reports:coverage/*/coverage.cobertura.xml \
                  -targetdir:coverage/text \
                  -reporttypes:TextSummary

                {
                  echo "### Code Coverage"
                  echo ""
                  echo '```'
                  cat coverage/text/Summary.txt
                  echo '```'
                } >> $GITHUB_STEP_SUMMARY

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                name: coverage_${{ matrix.tfm }}_${{ matrix.fb }}
                path: coverage/report
